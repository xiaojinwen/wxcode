plugins {
    id 'com.android.application'
}

android {
    namespace 'xiaojw.wxcode'
    compileSdk 34

    defaultConfig {
        applicationId 'xiaojw.wxcode'
        minSdk 17
        targetSdk 34
        versionCode 11
        versionName '2.0.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 自定义 APK 输出文件名：wxcode_版本号.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "wxcode_${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Xposed API (本地jar文件)
    compileOnly files('libs/api-82.jar')

    // NanoHTTPD for embedded HTTP server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // JSON library (Android自带org.json，可移除此依赖)
    // implementation 'org.json:json:20231013'
}